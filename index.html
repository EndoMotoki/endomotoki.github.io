<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EndoMotoki のアプリ</title>
<style>
:root{--bg:#15171a;--card:#1d2024;--text:#e8eaed;--muted:#aab1b9;--acc:#f08a3c}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.8 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 18px 48px}
h1{font-size:22px;margin:0 0 20px}
a.app{display:block;background:var(--card);border-radius:12px;padding:16px 18px;margin:0 0 12px;color:var(--text);text-decoration:none}
a.app b{display:block;font-size:17px;color:var(--acc)}
a.app span{color:var(--muted);font-size:13px}
div.app{background:var(--card);border-radius:12px;padding:16px 18px;margin:0 0 12px}
div.app b{display:block;font-size:17px;color:var(--acc)}
div.app span{color:var(--muted);font-size:13px}
.stores{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stores a{color:var(--text);text-decoration:none;font-size:13px;border:1px solid #3a4048;border-radius:999px;padding:4px 12px}
</style></head><body><main>
<h1>EndoMotoki のアプリ</h1>
<div class="app"><b>駐車練習</b><span>バック・前向き・縦列駐車と出庫を練習できるゲーム（iPhone / iPad / ウェブ版）</span>
  <div class="stores"><a href="https://apps.apple.com/jp/app/id6835015784">App Store（iPhone / iPad）</a><a href="./parking-game/">ウェブ版で遊ぶ</a></div></div>
<div class="app"><b>光洋バスナビ</b><span>いわき光洋高校発着の路線バス・スクールバスの時刻表をタップだけで見られるアプリ</span>
  <div class="stores"><a href="https://apps.apple.com/jp/app/id1209051575">App Store（iPhone）</a><a href="https://play.google.com/store/apps/details?id=net.aquacentral.koyobus">Google Play（Android）</a></div></div>
</main></body></html>
